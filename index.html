<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Concrete & Plywood Formwork Calculator</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #cbd5e1;
            --success-bg: #f0fdf4;
            --success-border: #bbf7d0;
            --success-text: #166534;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --danger-text: #991b1b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 12px;
            line-height: 1.5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 14px;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
        }
        header h1 {
            font-size: 1.2rem;
            font-weight: 700;
        }
        header p {
            font-size: 0.8rem;
            opacity: 0.9;
            margin-top: 2px;
        }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 12px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.84rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text);
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            font-size: 1rem;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: #fff;
            color: var(--text);
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .badge-info {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e40af;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.84rem;
            font-weight: 600;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
        }
        .result-box {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .result-main {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 10px;
        }
        .result-main span {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }
        .result-main h2 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 2px;
        }
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.82rem;
        }
        .res-item {
            background: rgba(255,255,255,0.12);
            padding: 8px 10px;
            border-radius: 8px;
        }
        .res-item strong {
            display: block;
            font-size: 0.95rem;
            margin-top: 2px;
        }
        .calc-summary {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            font-size: 0.85rem;
        }
        .calc-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed #e2e8f0;
        }
        .calc-row:last-child {
            border-bottom: none;
        }
        .status-box {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.86rem;
            margin-top: 10px;
        }
        .status-box.fail {
            background: var(--danger-bg);
            border-color: var(--danger-border);
            color: var(--danger-text);
        }
        .status-box p {
            font-weight: 700;
            margin-bottom: 4px;
        }
        .status-box p:last-child {
            margin-bottom: 0;
        }
        .btn-reset {
            width: 100%;
            padding: 12px;
            background: #e2e8f0;
            color: #334155;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
            margin-bottom: 20px;
        }
        .btn-reset:active {
            background: #cbd5e1;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Concrete & Plywood Calculator</h1>
        <p>Lateral Pressure, I, Z, Bending & Deflection Check</p>
    </header>

    <!-- Results Card -->
    <div class="result-box">
        <div class="result-main">
            <span>Maximum Concrete Pressure (P<sub>max</sub>)</span>
            <h2 id="res_pmax">85.10 kPa</h2>
        </div>
        <div class="result-grid">
            <div class="res-item">
                <span>Placement Rate (R)</span>
                <strong id="res_R">6.86 m/hr</strong>
            </div>
            <div class="res-item">
                <span>Plywood Z (NA)</span>
                <strong id="res_Z">99.20 mm³</strong>
            </div>
        </div>
    </div>

    <!-- Part 1: Concrete Pressure Parameters -->
    <div class="card">
        <div class="section-title">1. Concrete Pressure Parameters</div>
        
        <div class="form-group">
            <label for="temp">Concrete Temperature T (°C)</label>
            <input type="number" id="temp" value="20" step="0.1" inputmode="decimal" oninput="calculate()">
        </div>

        <div class="form-group">
            <label for="q_flow">Pouring Volume Rate Q (m³/hr)</label>
            <input type="number" id="q_flow" value="24.0" step="0.1" inputmode="decimal" oninput="calculate()">
        </div>

        <div class="row-2">
            <div class="form-group">
                <label for="length">Formwork Length (m)</label>
                <input type="number" id="length" value="0.25" step="0.01" inputmode="decimal" oninput="calculate()">
            </div>
            <div class="form-group">
                <label for="width">Formwork Width (m)</label>
                <input type="number" id="width" value="14.0" step="0.01" inputmode="decimal" oninput="calculate()">
            </div>
        </div>

        <div class="badge-info">
            <span>Area: <span id="badge_area">3.50</span> m²</span>
            <span>R = <span id="badge_R">6.86</span> m/hr</span>
        </div>

        <div class="form-group" style="margin-top: 12px;">
            <label for="c1_select">Coefficient C₁</label>
            <select id="c1_select" onchange="calculate()">
                <option value="1.5">Dimension > 2.0 m (C₁ = 1.5)</option>
                <option value="1.0" selected>Other cases (C₁ = 1.0)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="c2_select">Coefficient C₂</label>
            <select id="c2_select" onchange="handleC2Change()">
                <option value="0.30">Cement GP, HE, SR (C₂ = 0.30)</option>
                <option value="0.45">Cement LH or GB (C₂ = 0.45)</option>
                <option value="0.60" selected>Blends >40% Fly ash / >70% Slag (C₂ = 0.60)</option>
                <option value="0.15">Retarder or Superplasticizer (C₂ = 0.15)</option>
                <option value="custom">Custom C₂ Value...</option>
            </select>
        </div>

        <div class="form-group hidden" id="custom_c2_group">
            <label for="c2_custom">Custom C₂ Value</label>
            <input type="number" id="c2_custom" value="0.60" step="0.01" inputmode="decimal" oninput="calculate()">
        </div>

        <div class="row-2">
            <div class="form-group">
                <label for="H_height">Formwork Height H (m)</label>
                <input type="number" id="H_height" value="5.0" step="0.1" inputmode="decimal" oninput="calculate()">
            </div>
            <div class="form-group">
                <label for="h_height">Concrete Height h (m)</label>
                <input type="number" id="h_height" value="3.0
